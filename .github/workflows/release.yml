name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write
  packages: write

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Tag
        run: git fetch --force --tags
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: stable
      - name: Release
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传 linux 各架构裸二进制供 docker job 使用。
      # download-artifact@v4 会保持这些相对路径: subs-check_Linux_x86_64/subs-check 等
      - name: Upload linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/subs-check_Linux_x86_64/subs-check
            dist/subs-check_Linux_aarch64/subs-check
            dist/subs-check_Linux_armv7/subs-check

  docker:
    runs-on: ubuntu-latest
    needs: releaser
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: binaries

      # goreleaser 产出的二进制都叫 subs-check，按目录区分架构。
      # download-artifact 保持上传时的相对路径: subs-check_Linux_x86_64/subs-check 等
      # buildx 多平台构建时 Dockerfile 用 TARGETARCH (amd64/arm64/arm) 选择对应二进制
      - name: Prepare binaries for buildx
        run: |
          cd binaries
          mv subs-check_Linux_x86_64/subs-check subs-check-amd64
          mv subs-check_Linux_aarch64/subs-check subs-check-arm64
          mv subs-check_Linux_armv7/subs-check subs-check-arm
          rm -rf subs-check_Linux_*
          
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            # 如果 tag 包含 "beta"，只生成具体的版本标签
            type=match,pattern=^(.*-beta.*)$,group=1,enable=${{ contains(github.ref_name, 'beta') }}
            # 如果 tag 不包含 "beta"，生成版本标签
            type=match,pattern=^v(.*)$,group=1,enable=${{ !contains(github.ref_name, 'beta') }}
          flavor: |
            # 明确控制 latest 标签，只有当不包含 "beta" 时才生成
            latest=${{ !contains(github.ref_name, 'beta') }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
