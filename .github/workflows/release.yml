name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write
  packages: write

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Tag
        run: git fetch --force --tags
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: stable
      - name: Release
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 用 find 搜索 goreleaser 产出的 linux 裸二进制，重命名到固定路径后上传。
      # 不依赖 goreleaser dist/ 的具体目录命名（会随版本变化）。
      - name: Collect linux binaries
        run: |
          mkdir -p linux-out
          find dist -type f -name "subs-check" | while read f; do
            dir=$(dirname "$f")
            if echo "$dir" | grep -q 'arm64'; then
              cp "$f" linux-out/subs-check-arm64
            elif echo "$dir" | grep -q 'arm'; then
              cp "$f" linux-out/subs-check-arm
            elif echo "$dir" | grep -q 'amd64\|x86'; then
              cp "$f" linux-out/subs-check-amd64
            fi
          done
          echo "=== Collected binaries ==="
          ls -la linux-out/

      - name: Upload linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: linux-out/subs-check-*

  docker:
    runs-on: ubuntu-latest
    needs: releaser
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: binaries

      # 下载的文件已经是 subs-check-amd64 / subs-check-arm64 / subs-check-arm
      # Dockerfile 用 TARGETARCH (amd64/arm64/arm) 匹配对应文件
      - name: Verify binaries
        run: ls -la binaries/
          
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            # 如果 tag 包含 "beta"，只生成具体的版本标签
            type=match,pattern=^(.*-beta.*)$,group=1,enable=${{ contains(github.ref_name, 'beta') }}
            # 如果 tag 不包含 "beta"，生成版本标签
            type=match,pattern=^v(.*)$,group=1,enable=${{ !contains(github.ref_name, 'beta') }}
          flavor: |
            # 明确控制 latest 标签，只有当不包含 "beta" 时才生成
            latest=${{ !contains(github.ref_name, 'beta') }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
